name: Export complete CRM ZIP

on:
  push:
    branches:
      - export/omnisync-complete-zip

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          zip -r OmniSync-POS-complete.zip . -x ".git/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OmniSync-POS-complete
          path: OmniSync-POS-complete.zip
          retention-days: 1
